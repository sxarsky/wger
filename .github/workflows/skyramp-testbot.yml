name: Skyramp Testbot

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.actor != 'skyramp-testbot[bot]' }}

jobs:
  testbot:
    # Only run for pull_request events or issue_comment on PRs mentioning @skyramp-testbot
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@skyramp-testbot') && github.event.comment.user.login != 'skyramp-testbot[bot]')
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Generate GitHub App Token
        id: skyramp-testbot-app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SKYRAMP_TESTBOT_APP_ID }}
          private-key: ${{ secrets.SKYRAMP_TESTBOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.skyramp-testbot-app-token.outputs.token }}

      - uses: skyramp/testbot@89f8cd799fdbf8ff762568873f52dacab5d3e23f # v0.10.7
        with:
          skyrampLicenseFile: ${{ secrets.SKYRAMP_LICENSE_FILE }}
          anthropicApiKey: ${{ secrets.SKYRAMP_TESTBOT_API_KEY }}
          githubToken: ${{ steps.skyramp-testbot-app-token.outputs.token }}
          skyrampMcpVersion: 'v0.2.10-rc.1'
          skyrampExecutorVersion: 'v1.3.32'
          # Multi-repo: primary repo checked out at ./wger, related at ./wger-react.
          workingDirectory: 'wger'
          relatedRepoPaths: |
            ./wger-react
          # Build the wger server image, build the wger-react frontend from the
          # sibling checkout, layer it into the testbot image, then start the SUT.
          targetSetupCommand: 'docker build -t wger/server:pr-build-intermediate -f ./extras/docker/production/Dockerfile . && npm --prefix ../wger-react ci && npm --prefix ../wger-react run build && npm pack ../wger-react --pack-destination . && docker build -t wger/server:pr-build -f ./.skyramp/sut/Dockerfile.testbot . && rm -f wger-project-react-components-*.tgz && docker compose -f ./.skyramp/sut/docker-compose.testbot.yml up -d'
          targetReadyCheckCommand: 'curl -sf http://localhost/api/v2/version/'
          targetReadyCheckTimeout: '900'
          targetTeardownCommand: 'docker compose -f ./.skyramp/sut/docker-compose.testbot.yml down -v'
          authTokenCommand: 'bash ./.skyramp/sut/get-token.sh'

# Skyramp Workspace Configuration
workspace:
  repoName: sxarsky/wger
  repoUrl: https://github.com/sxarsky/wger
metadata:
  schemaVersion: v1
  mcpVersion: v0.2.10-rc.1
  executorVersion: v1.3.37
  updatedAt: "2026-08-09T00:59:52.436Z"
services:
  - serviceName: wger-backend
    language: python
    framework: pytest
    testDirectory: tests/skyramp
    api:
      schemaPath: http://localhost/api/v2/schema
      authType: token
      authHeader: Authorization
      authScheme: Token
      baseUrl: http://web:8000
    runtimeDetails:
      runtime: docker
      dockerNetwork: wger-testbot_default
  - serviceName: wger-react-frontend
    repository: sxarsky/wger-react
    language: typescript
    framework: vitest
    testDirectory: tests/skyramp
    api:
      authType: none
      authHeader: ""
      baseUrl: http://web:8000
    runtimeDetails:
      runtime: docker
      dockerNetwork: wger-testbot_default

# Skyramp Workspace Configuration
workspace:
  repoName: sxarsky/wger
  repoUrl: https://github.com/sxarsky/wger
metadata:
  schemaVersion: v1
  executorVersion: v1.3.37
  createdAt: "2026-08-10T01:56:04.678Z"
  updatedAt: "2026-08-10T01:56:04.681Z"
services:
  - serviceName: wger-backend
    language: python
    framework: pytest
    testDirectory: tests/skyramp
    api:
      schemaPath: http://localhost/api/v2/schema
      authType: token
      authHeader: Authorization
      authScheme: Token
      baseUrl: http://web:8000
    runtimeDetails:
      runtime: docker
      dockerNetwork: wger_testbot_network
  - serviceName: wger-react-frontend
    repository: sxarsky/wger-react
    language: typescript
    framework: playwright
    testDirectory: tests/skyramp
    api:
      authType: none
      authHeader: ""
      baseUrl: http://web:8000
    runtimeDetails:
      serverStartCommand: npm start
      runtime: local
